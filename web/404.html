<!-- GitHub Pages shows this page for any address that doesn't exist, at any depth, so everything it
     links to is spelled from the site's root. -->
<link rel="stylesheet" href="/theme.css">
<style>
  body { margin: 0; }
  .empty-state { display: grid; gap: 12px; justify-items: start; padding-block: 24px; }
  .empty-state h2 { margin: 0; font: 600 26px / 1.2 var(--serif); }
  .empty-state p { margin: 0; max-width: 55ch; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="wordmark-link" href="/" aria-label="fillmein home">
      <span class="wordmark" aria-hidden="true">
        <span><sup>1</sup>F</span><span>I</span><span>L</span><span>L</span><span class="wm-block"></span><span class="fill-letter"><sup>2</sup>M</span><span class="fill-letter">E</span><span class="wm-block"></span><span class="fill-letter"><sup>3</sup>I</span><span class="fill-letter">N</span>
      </span>
    </a>
  </header>

  <main class="empty-state">
    <h2>{{notfound.heading|line}}</h2>
    <p>{{notfound.body|line}}</p>
    <div class="actions">
      <a class="btn primary" href="/">Home</a>
      <a class="btn" href="/puzzles.html">My puzzles</a>
    </div>
  </main>

  <footer class="site-foot"><a href="/guide.html">How to make a crossword</a><a href="/privacy.html">Privacy</a><a href="/contact.html">Contact</a></footer>
</div>
