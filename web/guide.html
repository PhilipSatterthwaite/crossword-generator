<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{guide.title|plain}}</title>
<meta name="description" content="{{guide.description|plain}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="fillmein">
<meta property="og:title" content="{{guide.social.title|plain}}">
<meta property="og:description" content="{{guide.social.description|plain}}">
<meta property="og:image" content="https://fillmein.org/social.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  body { margin: 0; }
  .guide { max-width: 68ch; display: grid; gap: 16px; }
  .guide h1 { margin: 0; font: 600 36px / 1.12 var(--serif); }
  .guide h2 { margin: 26px 0 0; font: 600 25px / 1.2 var(--serif); }
  .guide h3 { margin: 14px 0 0; font: 600 17px / 1.3 var(--sans); }
  .guide p, .guide li { margin: 0; line-height: 1.6; }
  .guide ul, .guide ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
  .guide .standfirst { font: italic 400 19px / 1.45 var(--serif); color: var(--muted); }
  .guide a { color: var(--pencil); }

  /* What's on the page, for a reader deciding where to start. */
  .contents { padding: 16px 20px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
  .contents p { font: 600 12px / 1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  /* The steps number themselves in their headings, so the list doesn't number them again. */
  .contents ol { margin-top: 10px; gap: 5px; padding-left: 0; list-style: none; }
  .contents a { color: var(--ink); text-decoration: none; }
  .contents a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* A rule of the craft, set apart from the prose around it. */
  .rules { display: grid; gap: 10px; padding: 16px 20px; border-left: 3px solid var(--ink); background: var(--surface); }
  .rules h3 { margin: 0; font: 700 15px / 1.4 var(--sans); }
  .rules p { color: var(--muted); }
  .try { padding: 14px 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); font-size: 14px; }
  .try b { color: var(--ink); }
  .start { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="wordmark-link" href="index.html" aria-label="fillmein home">
      <span class="wordmark" aria-hidden="true">
        <span><sup>1</sup>F</span><span>I</span><span>L</span><span>L</span><span class="wm-block"></span><span class="fill-letter"><sup>2</sup>M</span><span class="fill-letter">E</span><span class="wm-block"></span><span class="fill-letter"><sup>3</sup>I</span><span class="fill-letter">N</span>
      </span>
    </a>
    <div class="account" data-account></div>
  </header>

  <div class="puzzle-bar">
    <a class="back-link" href="index.html"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</a>
  </div>

  <main class="guide">
    <h1>{{guide.heading|line}}</h1>
    <p class="standfirst">{{guide.standfirst|line}}</p>

    {{guide.body}}

    <div class="try">
      <p>{{guide.ready|line}}</p>
      <div class="start">
        <a class="btn primary" href="index.html">Start a puzzle</a>
        <a class="btn" href="puzzles.html">My puzzles</a>
      </div>
    </div>
  </main>

  <footer class="site-foot"><a href="guide.html" aria-current="page">How to make a crossword</a><a href="privacy.html">Privacy</a><a href="contact.html">Contact</a></footer>
</div>

<script src="filler.js"></script>
<script src="store.js"></script>
<script type="module" src="account.js"></script>
</body>
</html>
