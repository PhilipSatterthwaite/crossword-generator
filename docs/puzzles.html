<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My puzzles · fillmein</title>
<meta name="description" content="Every crossword you have started, in folders you can open, sort and rename.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="theme.css?v=da43c1842c">
<style>
  body { margin: 0; }
  .wordmark-link { color: inherit; text-decoration: none; }

  /* A file explorer: toolbar, address bar, column headings, then the items. */
  .explorer { border: 1px solid var(--rule); border-radius: 6px; background: var(--cell); overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); background: var(--surface); }
  .toolbar .btn { padding: 6px 10px; font-size: 13px; }
  .toolbar .divider { width: 1px; height: 20px; margin: 0 4px; background: var(--rule); }
  .toolbar .spacer { flex: 1; }

  .address { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); background: var(--cell); font-size: 13px; }
  .crumb { padding: 4px 9px; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--ink); font: 500 13px var(--sans); cursor: pointer; }
  .crumb:hover { border-color: var(--rule); background: var(--surface); }
  .crumb[aria-current="page"] { font-weight: 600; cursor: default; }
  .crumb.over { border-color: var(--focus); background: var(--word); }
  .address .sep { color: var(--muted); }

  .columns, .item { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.1fr) 84px 80px 88px; align-items: center; gap: 12px; }
  .columns { padding: 6px 12px; border-bottom: 1px solid var(--line-soft); background: var(--surface); font: 600 12px / 1 var(--sans); color: var(--muted); }
  .columns span:not(:first-child), .item .cell { font-variant-numeric: tabular-nums; }
  .items { list-style: none; margin: 0; padding: 0; min-height: 180px; }
  .item { padding: 6px 12px; border: 1px solid transparent; cursor: default; user-select: none; }
  .item:hover { background: var(--hover); }
  .item[aria-selected="true"] { background: var(--word); border-color: var(--focus); }
  .item.over { background: var(--word); border-color: var(--focus); border-style: dashed; }
  .item.dragging { opacity: 0.45; }
  .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .name .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .icon { flex: none; display: grid; place-items: center; width: 30px; height: 30px; }
  .icon svg { display: block; }
  .icon .grid-mark { background: #fff; outline: 1px solid var(--ink); }
  .cell { font-size: 13px; color: var(--muted); }
  .rename-input { width: 100%; min-width: 0; padding: 3px 6px; border: 1.5px solid var(--focus); border-radius: 2px; background: var(--cell); color: var(--ink); font: 500 14px var(--sans); }
  .empty-note { padding: 28px 14px; color: var(--muted); font-size: 14px; text-align: center; }
  .statusbar { display: flex; flex-wrap: wrap; gap: 12px; padding: 7px 12px; border-top: 1px solid var(--line-soft); background: var(--surface); font-size: 12px; color: var(--muted); }

  .menu { position: absolute; z-index: 5; min-width: 168px; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--cell); box-shadow: 0 10px 30px rgb(0 0 0 / 0.22); }
  .menu button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: 500 13px var(--sans); text-align: left; cursor: pointer; }
  .menu button:hover { background: var(--hover); }
  .menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--line-soft); }

  @media (max-width: 760px) {
    .columns, .item { grid-template-columns: minmax(0, 1fr) 84px; }
    .columns span:nth-child(2), .item .cell.when, .columns span:nth-child(4), .item .cell.filled, .columns span:nth-child(5), .item .cell.clues { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="wordmark-link" href="index.html" aria-label="fillmein home">
      <span class="wordmark" aria-hidden="true">
        <span><sup>1</sup>F</span><span>I</span><span>L</span><span>L</span><span class="wm-block"></span><span class="fill-letter"><sup>2</sup>M</span><span class="fill-letter">E</span><span class="wm-block"></span><span class="fill-letter"><sup>3</sup>I</span><span class="fill-letter">N</span>
      </span>
    </a>
    <div class="account" data-account></div>
  </header>

  <div class="puzzle-bar">
    <a class="back-link" href="index.html"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Home</a>
  </div>

  <div class="explorer">
    <div class="toolbar">
      <button type="button" id="new-puzzle" class="btn primary">New puzzle</button>
      <button type="button" id="new-folder" class="btn">New folder</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" id="open" class="btn quiet" disabled>Open</button>
      <button type="button" id="rename" class="btn quiet" disabled>Rename</button>
      <button type="button" id="remove" class="btn quiet danger" disabled>Delete</button>
      <span class="spacer"></span>
      <button type="button" id="up" class="btn quiet" disabled>Up one level</button>
    </div>

    <nav id="address" class="address" aria-label="Folder"></nav>

    <div class="columns" aria-hidden="true">
      <span>Name</span><span>Date modified</span><span>Size</span><span>Filled</span><span>Clues</span>
    </div>

    <ul id="items" class="items" role="listbox" aria-label="Puzzles and folders" tabindex="0"></ul>

    <div class="statusbar"><span id="count"></span><span id="chosen"></span></div>
  </div>
</div>

<script src="filler.js?v=0c1518a0b7"></script>
<script src="store.js?v=a9ac4a15e4"></script>
<script src="confirm.js?v=a8285e5eec"></script>
<script type="module" src="account.js?v=d7c4e1f8d7"></script>
<script>
(() => {
  "use strict";
  const S = window.GridfillStore;
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";
  const ROOT = "My puzzles";

  let here = "";          // the folder being looked at; "" is the top
  let picked = null;      // {kind: "folder" | "puzzle", id}
  let renaming = null;    // what is being renamed, so a redraw does not interrupt it
  let menu = null;

  const when = (time) => {
    const date = new Date(time);
    return `${date.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit", year: "numeric" })} ${date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}`;
  };

  function folderIcon() {
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", "26");
    svg.setAttribute("height", "26");
    svg.setAttribute("aria-hidden", "true");
    const back = document.createElementNS(SVG, "path");
    back.setAttribute("d", "M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v2H2z");
    back.setAttribute("fill", "#dca430");
    const front = document.createElementNS(SVG, "path");
    front.setAttribute("d", "M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z");
    front.setAttribute("fill", "#f0bf59");
    svg.append(back, front);
    return svg;
  }

  function gridIcon(grid) {
    if (!grid) {
      const blank = document.createElementNS(SVG, "svg");
      blank.setAttribute("viewBox", "0 0 24 24");
      blank.setAttribute("width", "24");
      blank.setAttribute("height", "24");
      blank.setAttribute("aria-hidden", "true");
      const box = document.createElementNS(SVG, "rect");
      box.setAttribute("x", "3.5");
      box.setAttribute("y", "2.5");
      box.setAttribute("width", "17");
      box.setAttribute("height", "19");
      box.setAttribute("fill", "#fff");
      box.setAttribute("stroke", "currentColor");
      blank.append(box);
      return blank;
    }
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", `0 0 ${grid.W} ${grid.H}`);
    svg.setAttribute("width", "26");
    svg.setAttribute("height", "26");
    svg.setAttribute("shape-rendering", "crispEdges");
    svg.setAttribute("class", "grid-mark");
    svg.setAttribute("aria-hidden", "true");
    grid.blocks.forEach((block, i) => {
      if (!block) return;
      const rect = document.createElementNS(SVG, "rect");
      rect.setAttribute("x", i % grid.W);
      rect.setAttribute("y", Math.floor(i / grid.W));
      rect.setAttribute("width", 1);
      rect.setAttribute("height", 1);
      rect.setAttribute("fill", "#14171C");
      svg.append(rect);
    });
    return svg;
  }

  function describe(puzzle) {
    const details = S.loadDetails(puzzle.id);
    const grid = S.loadGrid(puzzle.id);
    const title = details.title.trim() || "Untitled puzzle";
    const folder = (details.folder || "").trim();
    if (!grid) return { ...puzzle, title, folder, grid: null, size: "—", filled: "—", clues: "—" };
    const clues = S.loadClues(puzzle.id);
    const open = grid.blocks.filter((block) => !block).length;
    const done = grid.letters.filter((letter, i) => letter && !grid.blocks[i]).length;
    const clued = grid.slots.filter((slot) => S.hasClue(clues, slot)).length;
    return {
      ...puzzle,
      title,
      folder,
      grid,
      size: `${grid.W}×${grid.H}`,
      filled: `${open ? Math.round((100 * done) / open) : 100}%`,
      clues: `${clued}/${grid.slots.length}`,
    };
  }

  const puzzlesNow = () => S.list().map(describe);
  const foldersNow = (puzzles) => [...new Set([...S.folders(), ...puzzles.map((p) => p.folder).filter(Boolean)])].sort((a, b) => a.localeCompare(b));

  // --- moving things about ---

  function moveInto(kind, id, folder) {
    if (kind !== "puzzle") return;
    S.setFolder(id, folder);
    render();
  }

  function dropTarget(element, folder) {
    element.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      element.classList.add("over");
    });
    element.addEventListener("dragleave", (event) => {
      if (!element.contains(event.relatedTarget)) element.classList.remove("over");
    });
    element.addEventListener("drop", (event) => {
      event.preventDefault();
      element.classList.remove("over");
      const moved = event.dataTransfer.getData("text/plain");
      if (moved && moved.startsWith("puzzle:")) moveInto("puzzle", moved.slice(7), folder);
    });
  }

  // --- what you can do with the thing you picked ---

  function choose(kind, id) {
    picked = kind ? { kind, id } : null;
    for (const row of document.querySelectorAll(".item")) {
      row.setAttribute("aria-selected", String(Boolean(picked) && row.dataset.kind === picked.kind && row.dataset.id === picked.id));
    }
    const has = Boolean(picked);
    $("open").disabled = !has;
    $("rename").disabled = !has;
    $("remove").disabled = !has;
    $("chosen").textContent = has ? "1 selected" : "";
  }

  function openPicked() {
    if (!picked) return;
    if (picked.kind === "folder") {
      here = picked.id;
      render();
      return;
    }
    location.href = `grid.html?p=${encodeURIComponent(picked.id)}`;
  }

  function renamePicked() {
    if (!picked) return;
    renaming = { ...picked };
    const row = document.querySelector(`.item[data-kind="${picked.kind}"][data-id="${CSS.escape(picked.id)}"]`);
    if (!row) {
      renaming = null;
      return;
    }
    const label = row.querySelector(".entry-name");
    const was = label.textContent;
    const input = document.createElement("input");
    input.className = "rename-input";
    input.value = was;
    input.setAttribute("aria-label", "New name");
    const finish = (keep) => {
      const name = input.value.trim();
      renaming = null;
      if (!keep || !name || name === was) {
        render();
        return;
      }
      if (picked.kind === "folder") {
        const now = S.renameFolder(picked.id, name);
        if (here === picked.id) here = now;
        picked = { kind: "folder", id: now };
      } else {
        S.setTitle(picked.id, name);
      }
      render();
    };
    input.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Enter") finish(true);
      else if (event.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
    label.replaceChildren(input);
    input.focus();
    input.select();
  }

  async function deletePicked() {
    if (!picked) return;
    if (picked.kind === "folder") {
      const inside = puzzlesNow().filter((puzzle) => puzzle.folder === picked.id);
      const sure = await window.fillmeinConfirm({
        title: `Delete the folder “${picked.id}”?`,
        text: inside.length
          ? `Its ${inside.length} ${inside.length === 1 ? "puzzle moves" : "puzzles move"} back out to ${ROOT}; nothing is lost.`
          : "The folder is empty, so nothing else changes.",
        confirm: "Delete folder",
      });
      if (!sure) return;
      for (const puzzle of inside) S.setFolder(puzzle.id, "");
      S.removeFolder(picked.id);
      if (here === picked.id) here = "";
      picked = null;
      render();
      return;
    }
    const puzzle = puzzlesNow().find((other) => other.id === picked.id);
    const sure = await window.fillmeinConfirm({
      title: `Delete “${puzzle ? puzzle.title : "this puzzle"}”?`,
      text: "Its grid, clues and details go for good, on every device signed in to your account. This cannot be undone.",
    });
    if (!sure) return;
    S.remove(picked.id);
    picked = null;
    render();
  }

  // --- the right-click menu ---

  function closeMenu() {
    if (menu) menu.remove();
    menu = null;
  }

  function openMenu(x, y) {
    closeMenu();
    menu = document.createElement("div");
    menu.className = "menu";
    const add = (label, run) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.addEventListener("click", () => {
        closeMenu();
        run();
      });
      menu.append(button);
    };
    add(picked && picked.kind === "folder" ? "Open" : "Open puzzle", openPicked);
    add("Rename", renamePicked);
    menu.append(document.createElement("hr"));
    add("Delete", deletePicked);
    document.body.append(menu);
    menu.style.left = `${Math.min(x, window.innerWidth - menu.offsetWidth - 8)}px`;
    menu.style.top = `${Math.min(y + window.scrollY, window.scrollY + window.innerHeight - menu.offsetHeight - 8)}px`;
  }

  document.addEventListener("click", closeMenu);
  document.addEventListener("scroll", closeMenu, true);

  // --- drawing it ---

  function row({ kind, id, name, icon, modified, size, filled, clues }) {
    const item = document.createElement("li");
    item.className = "item";
    item.dataset.kind = kind;
    item.dataset.id = id;
    item.setAttribute("role", "option");
    item.setAttribute("aria-selected", "false");
    item.draggable = kind === "puzzle";

    const label = document.createElement("span");
    label.className = "entry-name";
    label.textContent = name;
    const nameCell = document.createElement("span");
    nameCell.className = "name";
    const iconBox = document.createElement("span");
    iconBox.className = "icon";
    iconBox.append(icon);
    nameCell.append(iconBox, label);

    const cell = (text, className) => {
      const span = document.createElement("span");
      span.className = `cell ${className}`;
      span.textContent = text;
      return span;
    };
    item.append(nameCell, cell(modified, "when"), cell(size, "size"), cell(filled, "filled"), cell(clues, "clues"));

    item.addEventListener("click", () => choose(kind, id));
    item.addEventListener("dblclick", () => {
      choose(kind, id);
      openPicked();
    });
    item.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      choose(kind, id);
      openMenu(event.clientX, event.clientY);
    });
    if (kind === "puzzle") {
      item.addEventListener("dragstart", (event) => {
        event.dataTransfer.setData("text/plain", `puzzle:${id}`);
        event.dataTransfer.effectAllowed = "move";
        item.classList.add("dragging");
      });
      item.addEventListener("dragend", () => item.classList.remove("dragging"));
    } else {
      dropTarget(item, id);
    }
    return item;
  }

  function render() {
    const puzzles = puzzlesNow();
    const folders = foldersNow(puzzles);
    if (here && !folders.includes(here)) here = "";

    // Address bar: My puzzles › this folder, and both take a dropped puzzle.
    const address = $("address");
    address.replaceChildren();
    const rootCrumb = document.createElement("button");
    rootCrumb.type = "button";
    rootCrumb.className = "crumb";
    rootCrumb.textContent = ROOT;
    if (!here) rootCrumb.setAttribute("aria-current", "page");
    rootCrumb.addEventListener("click", () => {
      here = "";
      render();
    });
    dropTarget(rootCrumb, "");
    address.append(rootCrumb);
    if (here) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      const crumb = document.createElement("button");
      crumb.type = "button";
      crumb.className = "crumb";
      crumb.textContent = here;
      crumb.setAttribute("aria-current", "page");
      dropTarget(crumb, here);
      address.append(sep, crumb);
    }

    const items = $("items");
    items.replaceChildren();
    const inside = puzzles.filter((puzzle) => (here ? puzzle.folder === here : !puzzle.folder));
    if (!here) {
      for (const name of folders) {
        const count = puzzles.filter((puzzle) => puzzle.folder === name).length;
        items.append(row({
          kind: "folder",
          id: name,
          name,
          icon: folderIcon(),
          modified: "",
          size: `${count} ${count === 1 ? "puzzle" : "puzzles"}`,
          filled: "",
          clues: "",
        }));
      }
    }
    for (const puzzle of inside) {
      items.append(row({
        kind: "puzzle",
        id: puzzle.id,
        name: puzzle.title,
        icon: gridIcon(puzzle.grid),
        modified: when(puzzle.updated),
        size: puzzle.size,
        filled: puzzle.filled,
        clues: puzzle.clues,
      }));
    }
    if (!items.children.length) {
      const empty = document.createElement("li");
      empty.className = "empty-note";
      empty.textContent = here ? "This folder is empty. Drag puzzles onto it, or onto its name above." : "No puzzles yet.";
      items.append(empty);
    }

    // A rename in progress survives a redraw (adding a folder causes one).
    if (renaming) {
      const again = renaming;
      renaming = null;
      picked = again;
      requestAnimationFrame(() => {
        picked = again;
        renamePicked();
      });
    }

    const shown = items.querySelectorAll(".item").length;
    $("count").textContent = `${shown} ${shown === 1 ? "item" : "items"}`;
    choose(picked && items.querySelector(`.item[data-kind="${picked.kind}"][data-id="${CSS.escape(picked.id)}"]`) ? picked.kind : null, picked ? picked.id : null);
    $("up").disabled = !here;
  }

  // --- toolbar and keys ---

  $("new-puzzle").addEventListener("click", () => {
    const id = S.create();
    if (here) S.setFolder(id, here);
    location.href = `grid.html?p=${encodeURIComponent(id)}`;
  });
  $("new-folder").addEventListener("click", () => {
    const base = "New folder";
    const taken = new Set(foldersNow(puzzlesNow()));
    let name = base;
    for (let n = 2; taken.has(name); n++) name = `${base} (${n})`;
    S.addFolder(name);
    here = "";
    picked = { kind: "folder", id: name };
    render();
    renamePicked(); // named straight away, the way a new folder is in Explorer
  });
  $("open").addEventListener("click", openPicked);
  $("rename").addEventListener("click", renamePicked);
  $("remove").addEventListener("click", deletePicked);
  $("up").addEventListener("click", () => {
    here = "";
    picked = null;
    render();
  });

  $("items").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      openPicked();
    } else if (event.key === "Delete") {
      event.preventDefault();
      deletePicked();
    } else if (event.key === "F2") {
      event.preventDefault();
      renamePicked();
    } else if (event.key === "Escape") {
      choose(null, null);
    }
  });
  // Clicking the empty space below the items clears the selection, as Explorer does.
  $("items").addEventListener("click", (event) => {
    if (event.target === $("items")) choose(null, null);
  });

  let waiting = 0;
  const later = () => {
    cancelAnimationFrame(waiting);
    waiting = requestAnimationFrame(render);
  };
  window.addEventListener("fillmein:changed", later);
  window.addEventListener("storage", (event) => {
    if (event.key === null || event.key.startsWith("fillmein:")) later();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") later();
  });

  render();
})();
</script>
</body>
</html>
