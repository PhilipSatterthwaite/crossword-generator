<style>
  body { margin: 0; }
  .wordmark-link { color: inherit; text-decoration: none; }

  /* A file explorer, but a rounder and springier one: toolbar, address bar, a tree of folders
     down the side, and whatever is in the folder you are looking at next to it. */
  .explorer { border: 1px solid var(--rule); border-radius: 18px; background: var(--cell); overflow: hidden; box-shadow: 0 10px 28px rgb(0 0 0 / 0.07); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); background: var(--surface); }
  .toolbar .btn { padding: 7px 13px; border-radius: 999px; font-size: 13px; transition: transform 0.16s cubic-bezier(0.2, 1.5, 0.4, 1), background 0.16s, box-shadow 0.16s; }
  .toolbar .btn:not(:disabled):hover { transform: translateY(-1.5px); box-shadow: 0 4px 12px rgb(0 0 0 / 0.12); }
  .toolbar .btn:not(:disabled):active { transform: translateY(1px) scale(0.97); box-shadow: none; }
  .toolbar .divider { width: 1px; height: 20px; margin: 0 3px; background: var(--rule); }
  .toolbar label.btn { position: relative; display: inline-block; }
  .toolbar label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .toolbar label.btn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .toolbar .spacer { flex: 1; }

  .address { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); background: var(--cell); font-size: 13px; }
  .crumb { padding: 5px 12px; border: 0; border-radius: 999px; background: none; color: var(--ink); font: 600 13px var(--sans); cursor: pointer; transition: transform 0.16s cubic-bezier(0.2, 1.5, 0.4, 1), background 0.16s; }
  .crumb:hover { background: var(--hover); transform: translateY(-1px); }
  .crumb[aria-current="page"] { background: var(--chip); cursor: default; }
  .crumb.over { background: var(--word); transform: scale(1.08); box-shadow: inset 0 0 0 2px var(--focus); }
  .address .sep { display: inline-flex; color: var(--muted); }
  .address .sep svg { width: 12px; height: 12px; }

  .panes { display: grid; grid-template-columns: 224px minmax(0, 1fr); }
  .panes[data-tree="false"] { grid-template-columns: minmax(0, 1fr); }
  .panes[data-tree="false"] .tree-pane { display: none; }
  .tree.over { outline: 2px dashed var(--focus); outline-offset: 4px; border-radius: 8px; }
  .toolbar .btn.over { background: var(--word); box-shadow: inset 0 0 0 2px var(--focus); }
  .tree-pane { border-right: 1px solid var(--line-soft); background: var(--surface); padding: 10px 8px 14px; }
  .tree-head { padding: 2px 10px 8px; font: 700 11px var(--sans); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .tree { list-style: none; margin: 0; padding: 0; }
  .node { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px calc(8px + var(--depth) * 15px); border-radius: 999px; cursor: pointer; user-select: none; transition: transform 0.16s cubic-bezier(0.2, 1.5, 0.4, 1), background 0.16s; animation: pop-in 0.24s cubic-bezier(0.2, 1.4, 0.4, 1) backwards; }
  .node:hover { background: var(--hover); transform: translateX(2px); }
  .node:focus-visible { outline: 3px solid var(--focus); outline-offset: -2px; }
  .node[aria-current="true"] { background: var(--word); font-weight: 700; }
  .node.over { background: var(--word); box-shadow: inset 0 0 0 2px var(--focus); transform: scale(1.04); }
  .node .twisty { flex: none; width: 16px; height: 16px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 9px; line-height: 1; cursor: pointer; transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .node .twisty[aria-expanded="true"] { transform: rotate(90deg); }
  .node .twisty.hidden { visibility: hidden; }
  .node .node-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .node .tally { margin-left: auto; padding: 1px 8px; border-radius: 999px; background: var(--chip); font: 600 11px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
  .node svg { flex: none; transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .node:hover svg { transform: rotate(-7deg) scale(1.1); }

  .columns, .item { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.1fr) 84px 80px 88px; align-items: center; gap: 12px; }
  .columns { padding: 8px 16px; border-bottom: 1px solid var(--line-soft); font: 700 11px / 1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .columns span:not(:first-child), .item .cell { font-variant-numeric: tabular-nums; }
  .items { list-style: none; margin: 0; padding: 8px; min-height: 260px; }
  .items:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .item { padding: 8px 12px; border-radius: 14px; cursor: default; user-select: none; transition: transform 0.16s cubic-bezier(0.2, 1.5, 0.4, 1), background 0.16s, box-shadow 0.16s; animation: pop-in 0.28s cubic-bezier(0.2, 1.4, 0.4, 1) backwards; animation-delay: calc(var(--i, 0) * 22ms); }
  .item:hover { background: var(--hover); transform: translateX(3px); }
  .item[aria-selected="true"] { background: var(--word); box-shadow: inset 0 0 0 2px var(--focus); }
  .item.over { background: var(--word); box-shadow: inset 0 0 0 2px var(--focus); animation: nudge 0.7s ease-in-out infinite; }
  .item.dragging { opacity: 0.4; transform: scale(0.98); }
  .item.cut { opacity: 0.52; }
  .item.landed { animation: landed 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .name { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .name .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
  .icon { flex: none; display: grid; place-items: center; width: 32px; height: 32px; }
  .icon svg { display: block; transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .icon .grid-mark { background: var(--cell); border-radius: 3px; outline: 1px solid var(--ink); }
  .icon .grid-mark rect { fill: var(--block); }
  .icon .blank-mark rect { fill: var(--cell); stroke: currentColor; }
  .item:hover .icon svg { transform: rotate(-7deg) scale(1.12); }
  .cell { font-size: 13px; color: var(--muted); }
  .rename-input { width: 100%; min-width: 0; padding: 4px 9px; border: 2px solid var(--focus); border-radius: 999px; background: var(--cell); color: var(--ink); font: 600 14px var(--sans); }
  .empty-note { padding: 46px 14px; color: var(--muted); font-size: 14px; text-align: center; }
  .statusbar { display: flex; flex-wrap: wrap; gap: 14px; padding: 9px 16px; border-top: 1px solid var(--line-soft); background: var(--surface); font-size: 12px; color: var(--muted); }

  .menu { position: absolute; z-index: 5; min-width: 178px; padding: 6px; border: 1px solid var(--rule); border-radius: 14px; background: var(--cell); box-shadow: 0 14px 34px rgb(0 0 0 / 0.22); animation: pop-in 0.16s cubic-bezier(0.2, 1.5, 0.4, 1); transform-origin: top left; }
  .menu button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 600 13px var(--sans); text-align: left; cursor: pointer; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .menu button:disabled { color: var(--muted); opacity: 0.55; cursor: default; }
  .menu hr { margin: 5px 8px; border: 0; border-top: 1px solid var(--line-soft); }

  @keyframes pop-in { from { opacity: 0; transform: translateY(7px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes nudge { 0%, 100% { transform: scale(1.015); } 50% { transform: scale(1.045); } }
  @keyframes landed { 0% { transform: scale(1); } 45% { transform: scale(1.06) rotate(-1deg); } 100% { transform: scale(1); } }

  @media (max-width: 860px) {
    .panes { grid-template-columns: minmax(0, 1fr); }
    .tree-pane { border-right: 0; border-bottom: 1px solid var(--line-soft); }
  }
  @media (max-width: 760px) {
    .columns, .item { grid-template-columns: minmax(0, 1fr) 84px; }
    .columns span:nth-child(2), .item .cell.when, .columns span:nth-child(4), .item .cell.filled, .columns span:nth-child(5), .item .cell.clues { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item, .node, .menu, .crumb, .toolbar .btn, .icon svg { animation: none !important; transition: none !important; }
  }
</style>

<script src="filler.js?v=3d9133dd4d"></script>
<script src="importers.js?v=9a8eef9d6b"></script>
<script src="store.js?v=20f8670730"></script>
<script src="confirm.js?v=e0e42d8b5d"></script>
<script type="module" src="account.js?v=72f64f9dd7"></script>
<script>
(() => {
  "use strict";
  const S = window.GridfillStore;
  const $ = (id) => document.getElementById(id);
  const SVG = "http://www.w3.org/2000/svg";
  const OPEN_KEY = "fillmein:folders-open";

  let here = "";          // the folder being looked at; "" is the top
  const TOP = "All puzzles"; // what the address bar calls the top, which isn't a folder of its own
  const CHEVRON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let picked = null;      // {kind: "folder" | "puzzle", id} — a folder's id is its whole path
  let clip = null;        // {mode: "cut" | "copy", kind, id}
  let renaming = null;    // what is being renamed, so a redraw does not interrupt it
  let landed = null;      // a folder something was just dropped into, so it can bounce
  let menu = null;

  const path = (value) => S.cleanPath(value);
  const nameOf = (folder) => S.nameOf(folder);
  const parentOf = (folder) => S.parentOf(folder);
  /* Is `other` the folder itself, or somewhere inside it? */
  const within = (folder, other) => Boolean(folder) && (other === folder || other.startsWith(`${folder}/`));

  let expanded = new Set();
  try { expanded = new Set(JSON.parse(localStorage.getItem(OPEN_KEY)) || []); } catch (error) { /* storage unavailable */ }
  const saveOpen = () => {
    try { localStorage.setItem(OPEN_KEY, JSON.stringify([...expanded])); } catch (error) { /* storage unavailable */ }
  };

  const when = (time) => {
    const date = new Date(time);
    return `${date.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit", year: "numeric" })} ${date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}`;
  };

  function folderIcon(size = 26) {
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("aria-hidden", "true");
    const back = document.createElementNS(SVG, "path");
    back.setAttribute("d", "M2.5 7a2.5 2.5 0 0 1 2.5-2.5h4l2 2h8.5A2.5 2.5 0 0 1 22 9v1.5H2.5z");
    back.setAttribute("fill", "#dca430");
    const front = document.createElementNS(SVG, "path");
    front.setAttribute("d", "M2.5 10h19v7.5a2.5 2.5 0 0 1-2.5 2.5H5a2.5 2.5 0 0 1-2.5-2.5z");
    front.setAttribute("fill", "#f0bf59");
    svg.append(back, front);
    return svg;
  }

  function gridIcon(grid) {
    if (!grid) {
      const blank = document.createElementNS(SVG, "svg");
      blank.setAttribute("viewBox", "0 0 24 24");
      blank.setAttribute("width", "24");
      blank.setAttribute("height", "24");
      blank.setAttribute("aria-hidden", "true");
      const box = document.createElementNS(SVG, "rect");
      box.setAttribute("x", "3.5");
      box.setAttribute("y", "2.5");
      box.setAttribute("width", "17");
      box.setAttribute("height", "19");
      box.setAttribute("rx", "2.5");
      blank.setAttribute("class", "blank-mark");
      blank.append(box);
      return blank;
    }
    const svg = document.createElementNS(SVG, "svg");
    svg.setAttribute("viewBox", `0 0 ${grid.W} ${grid.H}`);
    svg.setAttribute("width", "26");
    svg.setAttribute("height", "26");
    svg.setAttribute("shape-rendering", "crispEdges");
    svg.setAttribute("class", "grid-mark");
    svg.setAttribute("aria-hidden", "true");
    grid.blocks.forEach((block, i) => {
      if (!block) return;
      const rect = document.createElementNS(SVG, "rect");
      rect.setAttribute("x", i % grid.W);
      rect.setAttribute("y", Math.floor(i / grid.W));
      rect.setAttribute("width", 1);
      rect.setAttribute("height", 1);
      svg.append(rect);
    });
    return svg;
  }

  function describe(puzzle) {
    const details = S.loadDetails(puzzle.id);
    const grid = S.loadGrid(puzzle.id);
    const title = details.title.trim() || "Untitled puzzle";
    const folder = path(details.folder);
    if (!grid) return { ...puzzle, title, folder, grid: null, size: "—", filled: "—", clues: "—" };
    const clues = S.loadClues(puzzle.id);
    const open = grid.blocks.filter((block) => !block).length;
    const done = grid.letters.filter((letter, i) => letter && !grid.blocks[i]).length;
    const clued = grid.slots.filter((slot) => S.hasClue(clues, slot)).length;
    return {
      ...puzzle,
      title,
      folder,
      grid,
      size: `${grid.W}×${grid.H}`,
      filled: `${open ? Math.round((100 * done) / open) : 100}%`,
      clues: `${clued}/${grid.slots.length}`,
    };
  }

  const puzzlesNow = () => S.list().map(describe);
  /* Every folder there is: the ones made here, the ones puzzles remember, and the parents of both. */
  function foldersNow(puzzles) {
    const all = new Set();
    for (const folder of [...S.folders(), ...puzzles.map((puzzle) => puzzle.folder)]) {
      const names = path(folder).split("/").filter(Boolean);
      names.forEach((_, i) => all.add(names.slice(0, i + 1).join("/")));
    }
    return [...all].sort((a, b) => a.localeCompare(b));
  }
  const childrenOf = (folder, folders) => folders.filter((other) => parentOf(other) === folder);
  /* How many puzzles a folder holds, counting the ones in the folders inside it. */
  const tally = (folder, puzzles) => puzzles.filter((puzzle) => within(folder, puzzle.folder)).length;

  /* A name nothing else in that folder is using. */
  function freeName(parent, name, folders) {
    const taken = new Set(childrenOf(parent, folders).map(nameOf));
    if (!taken.has(name)) return name;
    let tried = `${name} copy`;
    for (let n = 2; taken.has(tried); n++) tried = `${name} copy ${n}`;
    return tried;
  }

  // --- moving things about ---

  function moveInto(kind, id, folder) {
    if (kind === "puzzle") {
      S.setFolder(id, folder);
      picked = { kind: "puzzle", id };
    } else if (kind === "folder") {
      if (within(id, folder) || parentOf(id) === folder) return;
      const now = S.moveFolder(id, folder);
      if (within(id, here)) here = now + here.slice(id.length);
      picked = { kind: "folder", id: now };
    } else {
      return;
    }
    if (folder) {
      landed = folder;
      expanded.add(folder);
      saveOpen();
    }
    render();
  }

  function dragSource(element, kind, id) {
    element.draggable = true;
    element.addEventListener("dragstart", (event) => {
      event.dataTransfer.setData("text/plain", `${kind}:${id}`);
      event.dataTransfer.effectAllowed = "move";
      element.classList.add("dragging");
    });
    element.addEventListener("dragend", () => element.classList.remove("dragging"));
  }

  /* Somewhere a folder or puzzle can be dropped. `folder` can be a function for a target, like the
     empty space below the items, that means "wherever we are right now". */
  function dropTarget(element, folder) {
    const into = () => (typeof folder === "function" ? folder() : folder);
    element.addEventListener("dragover", (event) => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      element.classList.add("over");
    });
    element.addEventListener("dragleave", (event) => {
      if (!element.contains(event.relatedTarget)) element.classList.remove("over");
    });
    element.addEventListener("drop", (event) => {
      event.preventDefault();
      event.stopPropagation();
      element.classList.remove("over");
      const moved = event.dataTransfer.getData("text/plain");
      const cut = moved.indexOf(":");
      if (cut > 0) moveInto(moved.slice(0, cut), moved.slice(cut + 1), into());
    });
  }

  // --- cut, copy and paste ---

  function holdIt(mode) {
    if (!picked) return;
    clip = { mode, kind: picked.kind, id: picked.id };
    render();
  }

  function pasteInto(folder) {
    if (!clip) return;
    const puzzles = puzzlesNow();
    const folders = foldersNow(puzzles);
    if (clip.kind === "puzzle") {
      if (clip.mode === "cut") {
        S.setFolder(clip.id, folder);
        picked = { kind: "puzzle", id: clip.id };
        clip = null;
      } else {
        const copy = S.duplicate(clip.id, folder);
        if (!copy) return;
        const was = puzzles.find((puzzle) => puzzle.id === clip.id);
        S.setTitle(copy, `${was ? was.title : "Untitled puzzle"} copy`);
        picked = { kind: "puzzle", id: copy };
      }
    } else {
      const from = clip.id;
      if (within(from, folder)) return; // a folder cannot go inside itself
      if (clip.mode === "cut") {
        if (parentOf(from) !== folder) picked = { kind: "folder", id: S.moveFolder(from, folder) };
        clip = null;
      } else {
        const target = [folder, freeName(folder, nameOf(from), folders)].filter(Boolean).join("/");
        S.addFolder(target);
        for (const other of folders) {
          if (other !== from && within(from, other)) S.addFolder(target + other.slice(from.length));
        }
        for (const puzzle of puzzles) {
          if (within(from, puzzle.folder)) S.duplicate(puzzle.id, target + puzzle.folder.slice(from.length));
        }
        picked = { kind: "folder", id: target };
      }
    }
    if (folder) {
      landed = folder;
      expanded.add(folder);
      saveOpen();
    }
    render();
  }

  /* Pasting with a folder picked out puts things in it; otherwise into the folder you are looking at. */
  const pasteWhere = () => (picked && picked.kind === "folder" ? picked.id : here);
  const canPaste = () => Boolean(clip) && !(clip.kind === "folder" && within(clip.id, pasteWhere()));

  // --- what you can do with the thing you picked ---

  function choose(kind, id) {
    picked = kind ? { kind, id } : null;
    let active = "";
    for (const row of document.querySelectorAll(".item")) {
      const on = Boolean(picked) && row.dataset.kind === picked.kind && row.dataset.id === picked.id;
      row.setAttribute("aria-selected", String(on));
      if (on) active = row.id;
    }
    // The list keeps the focus; this tells assistive technology which row is picked.
    if (active) $("items").setAttribute("aria-activedescendant", active);
    else $("items").removeAttribute("aria-activedescendant");
    const has = Boolean(picked);
    for (const button of ["open", "rename", "remove", "cut", "copy"]) $(button).disabled = !has;
    $("paste").disabled = !canPaste();
    $("chosen").textContent = has ? "1 selected" : "";
    $("clipnote").textContent = clip
      ? `${clip.mode === "cut" ? "Ready to move" : "Ready to copy"}: ${clip.kind === "folder" ? nameOf(clip.id) : "1 puzzle"}`
      : "";
  }

  function openPicked() {
    if (!picked) return;
    if (picked.kind === "folder") {
      here = picked.id;
      expanded.add(picked.id);
      saveOpen();
      picked = null;
      render();
      return;
    }
    location.href = `grid.html?p=${encodeURIComponent(picked.id)}`;
  }

  function renamePicked() {
    if (!picked) return;
    renaming = { ...picked };
    const row = document.querySelector(`.item[data-kind="${picked.kind}"][data-id="${CSS.escape(picked.id)}"]`);
    if (!row) {
      renaming = null;
      return;
    }
    const label = row.querySelector(".entry-name");
    const was = label.textContent;
    const input = document.createElement("input");
    input.className = "rename-input";
    input.value = was;
    input.setAttribute("aria-label", "New name");
    const finish = (keep) => {
      const name = input.value.trim();
      renaming = null;
      if (!keep || !name || name === was) {
        render();
        return;
      }
      if (picked.kind === "folder") {
        // A slash would make a folder inside a folder, so it becomes a dash.
        const now = S.renameFolder(picked.id, [parentOf(picked.id), name.replace(/\//g, "-")].filter(Boolean).join("/"));
        if (within(picked.id, here)) here = now + here.slice(picked.id.length);
        picked = { kind: "folder", id: now };
      } else {
        S.setTitle(picked.id, name);
      }
      render();
    };
    input.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Enter") finish(true);
      else if (event.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
    label.replaceChildren(input);
    input.focus();
    input.select();
  }

  async function deletePicked() {
    if (!picked) return;
    if (picked.kind === "folder") {
      const folder = picked.id;
      const out = parentOf(folder);
      const inside = puzzlesNow().filter((puzzle) => within(folder, puzzle.folder));
      const sure = await window.fillmeinConfirm({
        title: `Delete the folder “${nameOf(folder)}”?`,
        text: inside.length
          ? `Its ${inside.length} ${inside.length === 1 ? "puzzle moves" : "puzzles move"} to ${out ? `“${nameOf(out)}”` : "the top level"}; nothing is lost.`
          : "The folder is empty, so nothing else changes.",
        confirm: "Delete folder",
      });
      if (!sure) return;
      for (const puzzle of inside) S.setFolder(puzzle.id, out);
      S.removeFolder(folder);
      if (within(folder, here)) here = out;
      if (clip && clip.kind === "folder" && within(folder, clip.id)) clip = null;
      picked = null;
      render();
      return;
    }
    const puzzle = puzzlesNow().find((other) => other.id === picked.id);
    const sure = await window.fillmeinConfirm({
      title: `Delete “${puzzle ? puzzle.title : "this puzzle"}”?`,
      text: `Its grid, clues and details go for good${window.Fillmein && window.Fillmein.user() ? ", on every device signed in to your account" : ""}. This cannot be undone.`,
    });
    if (!sure) return;
    if (clip && clip.kind === "puzzle" && clip.id === picked.id) clip = null;
    S.remove(picked.id);
    picked = null;
    render();
  }

  // --- the right-click menu ---

  function closeMenu() {
    if (menu) menu.remove();
    menu = null;
  }

  function openMenu(x, y) {
    closeMenu();
    menu = document.createElement("div");
    menu.className = "menu";
    const add = (label, run, off) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled = Boolean(off);
      button.addEventListener("click", () => {
        closeMenu();
        run();
      });
      menu.append(button);
    };
    const folderPicked = Boolean(picked && picked.kind === "folder");
    add(folderPicked ? "Open" : "Open puzzle", openPicked);
    add("Rename", renamePicked);
    menu.append(document.createElement("hr"));
    add("Cut", () => holdIt("cut"));
    add("Copy", () => holdIt("copy"));
    add(folderPicked ? "Paste into folder" : "Paste", () => pasteInto(pasteWhere()), !canPaste());
    menu.append(document.createElement("hr"));
    add("Delete", deletePicked);
    document.body.append(menu);
    menu.style.left = `${Math.min(x, window.innerWidth - menu.offsetWidth - 8)}px`;
    menu.style.top = `${Math.min(y + window.scrollY, window.scrollY + window.innerHeight - menu.offsetHeight - 8)}px`;
  }

  document.addEventListener("click", closeMenu);
  document.addEventListener("scroll", closeMenu, true);

  // --- drawing it ---

  function row({ kind, id, name, icon, modified, size, filled, clues }, index) {
    const item = document.createElement("li");
    item.className = "item";
    item.style.setProperty("--i", index);
    item.dataset.kind = kind;
    item.dataset.id = id;
    item.id = `item-${index}`;
    item.setAttribute("role", "option");
    item.setAttribute("aria-selected", "false");
    if (clip && clip.mode === "cut" && clip.kind === kind && clip.id === id) item.classList.add("cut");

    const label = document.createElement("span");
    label.className = "entry-name";
    label.textContent = name;
    const nameCell = document.createElement("span");
    nameCell.className = "name";
    const iconBox = document.createElement("span");
    iconBox.className = "icon";
    iconBox.append(icon);
    nameCell.append(iconBox, label);

    const cell = (text, className) => {
      const span = document.createElement("span");
      span.className = `cell ${className}`;
      span.textContent = text;
      return span;
    };
    item.append(nameCell, cell(modified, "when"), cell(size, "size"), cell(filled, "filled"), cell(clues, "clues"));

    item.addEventListener("click", () => choose(kind, id));
    item.addEventListener("dblclick", () => {
      choose(kind, id);
      openPicked();
    });
    item.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      choose(kind, id);
      openMenu(event.clientX, event.clientY);
    });
    dragSource(item, kind, id);
    if (kind === "folder") {
      dropTarget(item, id);
      if (landed === id) item.classList.add("landed");
    }
    return item;
  }

  /* One line of the folder tree down the side. Every line takes a drop, so a puzzle two folders deep
     can be dragged straight up to the top, or across into another folder. */
  function treeNode(folder, folders, puzzles, depth) {
    const line = document.createElement("li");
    const node = document.createElement("div");
    node.className = "node";
    node.style.setProperty("--depth", depth);
    node.dataset.folder = folder;
    node.setAttribute("aria-current", String(folder === here));

    const kids = childrenOf(folder, folders);
    const open = expanded.has(folder);
    const twisty = document.createElement("button");
    twisty.type = "button";
    twisty.className = `twisty${kids.length ? "" : " hidden"}`;
    twisty.textContent = "▶";
    twisty.setAttribute("aria-expanded", String(open));
    twisty.setAttribute("aria-label", open ? "Collapse" : "Expand");
    twisty.addEventListener("click", (event) => {
      event.stopPropagation();
      if (expanded.has(folder)) expanded.delete(folder);
      else expanded.add(folder);
      saveOpen();
      render();
    });

    const label = document.createElement("span");
    label.className = "node-name";
    label.textContent = nameOf(folder);
    const pill = document.createElement("span");
    pill.className = "tally";
    pill.textContent = String(tally(folder, puzzles));

    node.append(twisty, folderIcon(18), label, pill);
    node.tabIndex = 0;
    node.addEventListener("click", () => {
      here = folder;
      picked = null;
      expanded.add(folder);
      saveOpen();
      render();
    });
    node.addEventListener("keydown", (event) => {
      if (event.target !== node || (event.key !== "Enter" && event.key !== " ")) return;
      event.preventDefault();
      event.stopPropagation();
      node.click();
    });
    dropTarget(node, folder);
    dragSource(node, "folder", folder);
    line.append(node);

    const lines = [line];
    if (open) for (const kid of kids) lines.push(...treeNode(kid, folders, puzzles, depth + 1));
    return lines;
  }

  function render() {
    const puzzles = puzzlesNow();
    const folders = foldersNow(puzzles);
    if (here && !folders.includes(here)) here = "";
    if (clip && clip.kind === "folder" && !folders.includes(clip.id)) clip = null;
    // Keep the way down to wherever you are open in the tree.
    const names = here.split("/").filter(Boolean);
    names.forEach((_, i) => expanded.add(names.slice(0, i + 1).join("/")));

    // Address bar, the way a file explorer draws one: a chevron, then the top, then a chevron and each
    // folder on the way down. Every crumb takes a drop.
    const address = $("address");
    address.replaceChildren();
    const steps = [{ folder: "", name: TOP }, ...names.map((name, i) => ({ folder: names.slice(0, i + 1).join("/"), name }))];
    steps.forEach((step) => {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.innerHTML = CHEVRON;
      address.append(sep);
      const crumb = document.createElement("button");
      crumb.type = "button";
      crumb.className = "crumb";
      crumb.textContent = step.name;
      if (step.folder === here) crumb.setAttribute("aria-current", "page");
      crumb.addEventListener("click", () => {
        here = step.folder;
        picked = null;
        render();
      });
      dropTarget(crumb, step.folder);
      address.append(crumb);
    });

    // The whole shape of things, down the side: the folders themselves, with nothing made up above them.
    // With no folders at all there's nothing to show, and the list takes the whole width.
    $("tree").replaceChildren(...childrenOf("", folders).flatMap((folder) => treeNode(folder, folders, puzzles, 0)));
    document.querySelector(".panes").dataset.tree = String(folders.length > 0);

    const items = $("items");
    items.replaceChildren();
    let index = 0;
    for (const folder of childrenOf(here, folders)) {
      const count = tally(folder, puzzles);
      items.append(row({
        kind: "folder",
        id: folder,
        name: nameOf(folder),
        icon: folderIcon(),
        modified: "",
        size: `${count} ${count === 1 ? "puzzle" : "puzzles"}`,
        filled: "",
        clues: "",
      }, index++));
    }
    for (const puzzle of puzzles.filter((puzzle) => puzzle.folder === here)) {
      items.append(row({
        kind: "puzzle",
        id: puzzle.id,
        name: puzzle.title,
        icon: gridIcon(puzzle.grid),
        modified: when(puzzle.updated),
        size: puzzle.size,
        filled: puzzle.filled,
        clues: puzzle.clues,
      }, index++));
    }
    if (!items.children.length) {
      const empty = document.createElement("li");
      empty.className = "empty-note";
      empty.textContent = here ? "This folder is empty. Drag puzzles onto it, or paste them in." : "No puzzles yet.";
      items.append(empty);
    }
    landed = null;

    // A rename in progress survives a redraw (adding a folder causes one).
    if (renaming) {
      const again = renaming;
      renaming = null;
      picked = again;
      requestAnimationFrame(() => {
        picked = again;
        renamePicked();
      });
    }

    const shown = items.querySelectorAll(".item").length;
    $("count").textContent = `${shown} ${shown === 1 ? "item" : "items"}`;
    choose(picked && items.querySelector(`.item[data-kind="${picked.kind}"][data-id="${CSS.escape(picked.id)}"]`) ? picked.kind : null, picked ? picked.id : null);
    $("up").disabled = !here;
  }

  // --- toolbar and keys ---

  $("new-puzzle").addEventListener("click", () => {
    const id = S.create();
    if (here) S.setFolder(id, here);
    location.href = `grid.html?p=${encodeURIComponent(id)}`;
  });
  $("new-folder").addEventListener("click", () => {
    const folders = foldersNow(puzzlesNow());
    const taken = new Set(childrenOf(here, folders).map(nameOf));
    let name = "New folder";
    for (let n = 2; taken.has(name); n++) name = `New folder (${n})`;
    picked = { kind: "folder", id: S.addFolder([here, name].filter(Boolean).join("/")) };
    render();
    renamePicked(); // named straight away, the way a new folder is in Explorer
  });
  $("import-file").addEventListener("change", async (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const puzzle = window.GridImport.read(file.name, await file.arrayBuffer());
      location.href = `grid.html?p=${encodeURIComponent(S.importPuzzle(puzzle, here))}`;
    } catch (error) {
      await window.fillmeinChoose({ title: "That file couldn't be opened", text: error.message || "", choices: [{ value: "ok", label: "OK" }] });
    }
  });
  $("open").addEventListener("click", openPicked);
  $("rename").addEventListener("click", renamePicked);
  $("remove").addEventListener("click", deletePicked);
  $("cut").addEventListener("click", () => holdIt("cut"));
  $("copy").addEventListener("click", () => holdIt("copy"));
  $("paste").addEventListener("click", () => pasteInto(pasteWhere()));
  $("up").addEventListener("click", () => {
    here = parentOf(here);
    picked = null;
    render();
  });

  document.addEventListener("keydown", (event) => {
    const target = event.target;
    if (target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName)) return;
    if (document.querySelector("dialog[open]")) return;
    if (event.ctrlKey || event.metaKey) {
      const key = event.key.toLowerCase();
      if (key === "c" && picked) {
        event.preventDefault();
        holdIt("copy");
      } else if (key === "x" && picked) {
        event.preventDefault();
        holdIt("cut");
      } else if (key === "v" && canPaste()) {
        event.preventDefault();
        pasteInto(pasteWhere());
      }
      return;
    }
    // Arrow keys walk the list once it has the focus (a click on a row gives it that, as does Tab).
    if (["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key) && document.activeElement === $("items")) {
      const rows = [...document.querySelectorAll("#items .item")];
      if (!rows.length) return;
      event.preventDefault();
      const at = rows.findIndex((row) => row.getAttribute("aria-selected") === "true");
      const to = event.key === "Home" ? 0
        : event.key === "End" ? rows.length - 1
        : Math.min(rows.length - 1, Math.max(0, at + (event.key === "ArrowDown" ? 1 : -1)));
      choose(rows[to].dataset.kind, rows[to].dataset.id);
      rows[to].scrollIntoView({ block: "nearest" });
      return;
    }
    if (event.key === "Enter") {
      event.preventDefault();
      openPicked();
    } else if (event.key === "Delete") {
      event.preventDefault();
      deletePicked();
    } else if (event.key === "F2") {
      event.preventDefault();
      renamePicked();
    } else if (event.key === "Backspace" && here) {
      event.preventDefault();
      here = parentOf(here);
      picked = null;
      render();
    } else if (event.key === "Escape") {
      clip = null;
      choose(null, null);
    }
  });
  // Clicking the empty space below the items clears the selection, as Explorer does.
  $("items").addEventListener("click", (event) => {
    if (event.target === $("items")) choose(null, null);
  });
  // Dropping on that empty space files something in the folder you are looking at.
  dropTarget($("items"), () => here);
  // Nothing stands for the top level, so the tree's empty space takes a drop for it, and Up one level
  // takes one for the folder above.
  dropTarget($("tree"), "");
  dropTarget($("up"), () => parentOf(here));

  let waiting = 0;
  const later = () => {
    cancelAnimationFrame(waiting);
    waiting = requestAnimationFrame(render);
  };
  window.addEventListener("fillmein:changed", later);
  window.addEventListener("storage", (event) => {
    if (event.key === null || event.key.startsWith("fillmein:")) later();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") later();
  });

  render();
})();
</script>
</body>
</html>
